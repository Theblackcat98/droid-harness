# Giant beatdown v3, base (E1): training-camp-v2 with Giant as the only win condition,
# and generic counter rows for the other_ground / other_air catch-all classes.
# Defense also respects what a card can hit now (code, all strategies): Giant never
# defends, Mini P.E.K.K.A never answers air, whatever the counter table says.
#
# The experiments below are children of this file, one change each; run them one at a
# time against this base (droid-harness run-experiment --test pairs):
#   training-camp-v3-e3-tank-ahead.yaml   tank leads counter-pushes
#   training-camp-v3-e4-cycle-gate.yaml   push when their Giant counter is out of hand
#   training-camp-v3-e5-reserve.yaml      keep a defense reserve; back-build Giant
# Needs a detector (it can't see units otherwise): until then use training-camp-blind-v1.
strategy: training-camp-v3
parent: training-camp-v2
deck: [knight, archers, minions, arrows, fireball, giant, musketeer, mini_pekka]
win_conditions: [giant]   # Princess is ranged support, not a win condition (E1)
params:
  act_threshold: 0.15
  elixir_weight: 0.4
  defend_trigger_tiles: 12
  defend_horizon_s: 8.0
  min_elixir_to_attack: 7
  press_opp_elixir_max: 3.0
  spell_value_threshold: 4.0
  spell_cycle_max_casts: 3
  opening_ms: 30000
  min_action_gap_ms: 350
  counter_push_bonus: 0.4
  attack_blocked_by_threat_eta_s: 8.0
  # Opponent cards that hard-counter Giant. Inert until counter_gate: true (E4).
  wc_counters: [mini_pekka, pekka, inferno_tower, inferno_dragon, cannon, tesla, tombstone, bomb_tower, goblin_cage, skeleton_army, guards, minions, minion_horde, barbarians, elite_barbarians, hunter]
tier0:
  lethal_margin_hp: 30
  spell_tower_damage: {}        # fill in from the account's card levels
  leak_threshold: 9.3
  leak_ms: 800
  leak_card_preference: [minions, knight, arrows]
  emergency_eta_s: 1.5
  emergency_hp_frac: 0.35
weights:
  defend.lane_threat: 1.0
  defend.air_threat: 1.0
  offense.win_condition_when_opp_low: 1.0
  offense.counter_push: 0.8
  spell.value: 0.8
  spell.tower_chip: 0.6
  opening.safe_first_play: 1.0
  cycle.cheap_cycle: 1.0
posture_multipliers:
  OPENING:     {offense: 0.3, cycle: 1.2}
  DEFEND_LEAD: {offense: 0.5, defend: 1.3}
  PRESS:       {offense: 1.4}
  SPELL_CYCLE: {spell: 2.0, offense: 0.6}
counters: counters/training-camp-v3.csv
learned_ranker: null
intent_advisor: false
advisor_may_set: [DEFEND_LEAD, PRESS, SPELL_CYCLE]
