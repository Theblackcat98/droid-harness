# Ladder beatdown v11: v10 + opening discipline for win-condition counter-pushes.
# - v10: measured arrows tower damage (33 -> 44, Lv5); v9's lethal-spell math was 11 HP short.
# - NEW: a win condition no longer rides a counter-push during OPENING below giant_x1_min_elixir
#   (8.5). Match fd764cd16dbe: knight back-build at 5.4 s, Giant back-build at 6.2 s -> 1.15
#   elixir left, opponent's Giant walked the right tower at 22 s (0-3 in 43 s). Same barrier the
#   giant_back_build rule already applies; giant_back_build_allow_in_opening=false is now honored
#   by counter_push as well.
# - Everything in v8 (level-aware, banked win condition, audit fixes) is unchanged.
# - NEW: ignore_cheap_threat_cost 2 — never spend a 3-4 elixir card to answer a <=2 elixir probe
#   (skeletons, spear goblins, goblins, fire spirit) that is still >2.5 s from a healthy tower,
#   while the lane total stays <= 3.0. Audited losses spent 20-27 cards per match on defense and
#   never banked enough to play the Giant (wincon_starved in 5 of 9 matches).
# - NEW: spell_value_threshold 4.5 (was 3.5) — arrows/fireball hit negative value 9 times in 9
#   matches (mean -2.6).
# - Fixes carried in the same release: lethal spells need a stable tower HP read (an undamaged
#   King tower misread as "5" fired a 4-elixir Fireball at 11 s in every audited match).
