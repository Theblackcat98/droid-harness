# Ladder beatdown v5: tuned on Batch 1 (v4) to fix Giant starvation while keeping
# pro-style card, cost, and cycle tracking.
# - Relaxes GiantBackBuild threat block distance (9.0 tiles) and floor (7.2 elixir)
#   so distant river pokes no longer cancel a back-built Giant.
# - Reduces over-eager defense trigger (11.5 tiles) and stacks lighter penalties on
#   bridge Giant & counterpush Giant so Giant actually deploys every game.
strategy: ladder-vision-v5
parent: ladder-vision-v4
deck: [knight, archers, minions, arrows, fireball, giant, musketeer, mini_pekka]
win_conditions: [giant]
params:
  act_threshold: 0.08
  elixir_weight: 0.4
  defend_trigger_tiles: 11.5
  defend_horizon_s: 8.5
  min_elixir_to_attack: 5.5
  press_opp_elixir_max: 4.0
  max_opp_elixir_to_bridge: 6.0
  min_elixir_advantage_to_bridge: 1.5
  spell_value_threshold: 3.5
  spell_cycle_max_casts: 3
  opening_ms: 15000
  min_action_gap_ms: 350
  counter_push_bonus: 0.6
  counterpush_min_value: 2.0
  counterpush_tank_ahead: true
  counterpush_tank_bonus: 0.35
  giant_back_build: true
  giant_safe_build_elixir: 7.2
  giant_back_build_score: 0.72
  giant_build_block_tiles: 9.0
  attack_blocked_by_threat_eta_s: 6.0
  counter_gate: true
