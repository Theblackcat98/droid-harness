# Ladder beatdown v7 = v6 + level awareness (a single hypothesis, todo R8).
# Opponents at ~476 trophies read King Level 4-5 vs our 2: v6 plays as if levels were equal.
strategy: ladder-vision-v7
parent: ladder-vision-v6
deck: [knight, archers, minions, arrows, fireball, giant, musketeer, mini_pekka]
win_conditions: [giant]
params:
